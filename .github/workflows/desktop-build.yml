name: Desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-agent.txt
            requirements-desktop.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
      - name: Install Python build and agent dependencies
        run: python -m pip install -r requirements-agent.txt -r requirements-desktop.txt
      - name: Verify Python desktop lifecycle
        run: python -m unittest tests.test_desktop_runtime tests.test_desktop_packaging -v
      - name: Build native installer
        run: python desktop/build.py
      - name: Validate packaged backend and exported 3D
        run: python desktop/smoke.py --payload desktop/src-tauri/payload --check-sdk
      - name: Upload installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: LOW-SKY-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.sha256
            desktop/src-tauri/payload/build-info.json
          if-no-files-found: error
          retention-days: 14
